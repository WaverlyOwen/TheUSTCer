name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          # 与 deploy-pages 保持一致：22 为当前 LTS
          node-version: 22
          cache: npm

      - name: Install Dependencies
        run: npm ci

      # 含求解器小棋盘穷举交叉检验（test/solver.test.js），
      # 任何新增剪枝都应先过这道关口
      - name: Run Tests
        run: npm test
